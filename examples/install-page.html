<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>领取我的专属描述文件</title>
<style>
  body{margin:0;padding:28px 20px;background:#f6f7f9;color:#1c1c1e;
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  .card{max-width:520px;margin:0 auto;background:#fff;border-radius:16px;
        padding:26px 22px;box-shadow:0 2px 14px rgba(0,0,0,.06)}
  h1{font-size:21px;margin:0 0 8px}
  p{font-size:14px;line-height:1.7;color:#555}
  .btn{display:block;margin:22px 0 8px;padding:15px;text-align:center;
       border-radius:12px;background:#e63946;color:#fff;font-size:17px;
       font-weight:600;text-decoration:none}
  .k{font-size:12px;color:#888;line-height:1.6}
  code{background:#f2f3f5;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="card">
  <h1>领取我的专属描述文件</h1>
  <p>每人会拿到一个专属令牌。装完之后：</p>
  <p>· DNS 走自建节点，按域名规则过滤广告<br>
     · 桌面多一个图标，点开就能<b>单独开关</b>过滤，不影响别人<br>
     · 不想用了，删除描述文件即可完全恢复</p>
  <a class="btn" href="/issue">领取我的专属描述文件</a>
  <p class="k">安装后到「设置 → 通用 → VPN 与设备管理」完成安装。<br>
     管理后台：<code>/users</code> · 候选广告审核：<code>/candidates</code><br>
     把本页地址做成二维码即可分发给其他人。</p>
</div>
</body>
</html>
